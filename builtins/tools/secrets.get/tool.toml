[tool]
name = "secrets.get"
description = "Read a secret value from the environment. Returns the value or an error if unavailable."

[tool.schema]
type = "object"
required = ["name"]
properties.name.type = "string"
properties.name.description = "The secret key to read."

[tool.invocation]
