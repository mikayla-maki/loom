[tool]
name = "read_file"
description = "Read a UTF-8 file from disk and return its contents."

[tool.schema]
type = "object"
required = ["path"]
properties.path.type = "string"
properties.path.description = "Path to the file to read."

[tool.invocation]
command = "loom-read-file"

[tool.secrets]
required = []

[tool.capabilities]
filesystem = ["./"]
network = []
