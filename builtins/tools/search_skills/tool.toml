# search_skills is implemented in-process by the runtime; this manifest
# exists so `requires: { search_skills: builtin }` resolves and the
# capability declarations are visible to the audit.

[tool]
name = "search_skills"
description = "List skills available for dynamic addition (registry / builtin / provider-supplied)."

[tool.schema]
type = "object"
properties.query.type = "string"
properties.query.description = "Optional substring filter applied to skill name + description."

[tool.invocation]
# The runtime replaces this tool with an in-process implementation; the
# command is never executed. We keep a value here so the manifest validates.
command = "(in-process)"

[tool.secrets]
required = []

[tool.capabilities]
filesystem = []
network = []
