[tool]
name = "spawn_subagent"
description = "Run another Glass agent (a subagent) with a given prompt and return its final assistant message."

[tool.schema]
type = "object"
required = ["scope", "prompt"]
properties.scope.type = "string"
properties.scope.description = "Subagent name as declared by a skill's `subagents` field, OR a path to an agent.toml."
properties.prompt.type = "string"
properties.prompt.description = "User prompt forwarded to the subagent."

[tool.invocation]
command = "glass-spawn-subagent"

[tool.secrets]
required = []

[tool.capabilities]
filesystem = ["./"]
network = []
subagent = "*"
