# add_skill is implemented in-process by the runtime so it can mutate the
# agent's state (skills list, ceiling, tool table) and route capability
# expansion through the registered PermissionHandler.

[tool]
name = "add_skill"
description = "Add a discovered skill to the running agent. Capabilities exceeding the current sandbox require user permission."

[tool.schema]
type = "object"
required = ["name"]
properties.name.type = "string"
properties.name.description = "The skill name to add (as returned by search_skills)."
properties.rationale.type = "string"
properties.rationale.description = "Optional one-line explanation shown to the user when permission is requested."

[tool.invocation]
command = "(in-process)"

[tool.secrets]
required = []

[tool.capabilities]
filesystem = []
network = []
