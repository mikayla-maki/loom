# ───────────────────────────────────────────────────────────────────────────
# Loom full-agent example — demonstrates the full v5 provider surface
# ───────────────────────────────────────────────────────────────────────────
#
# Run:           loom run examples/full-agent/agent.toml
# Audit:         loom audit examples/full-agent/agent.toml
#
# This is the declarative shape. For the same agent constructed in
# TypeScript — hand-building the `CompactingSession` so it can
# drive `compactNow()` from a `/compact` slash command — see
# `examples/sdk-agent/agent.ts`. This manifest depends on the
# sibling `examples/notes-provider/` package (referenced below
# under `[providers]`).
#
# What this example shows:
#   - `[providers]` declares a local handle for an external provider
#                   — here, the sibling `notes-provider/` package.
#   - `[harness]`   picks a built-in factory.
#   - `[session]`   declares the agent's session as a layered
#                   composition (outer-to-inner): bounded growth via
#                   `compacting`, persistent cross-session notes via
#                   the `notes` provider's `NotesSession`, raw event
#                   storage via `in-memory`. The middle layer is the
#                   interesting one — it loads notes from a markdown
#                   file into the system prompt AND owns the `remember`
#                   verb the model uses to save new ones. See
#                   `../notes-provider/index.ts`.
#   - `[tools]`     mixes built-in tools, names contributed by
#                   the session itself (here: `remember`), AND
#                   harness-exposed server tools (`web_search`,
#                   `web_fetch` — dispatched API-side by Anthropic,
#                   not the local runtime). Sessions contributing
#                   tools need no `[tools.X]` entry; harness-exposed
#                   tools DO opt in via `"anthropic"` as the provider.
#   - `[capabilities]` is a transitive ceiling. `remember` doesn't
#                   need a grant because the demo session writes to
#                   its own configured file, not user-pickable paths.
#                   `web_search` and `web_fetch` accept an
#                   `allowed_domains` allow-list — their egress is
#                   on Anthropic's side but the manifest still
#                   declares which domains are in-scope.
# ───────────────────────────────────────────────────────────────────────────

[agent]
name = "loom-demo"
system_prompt = """
You are a helpful assistant who keeps notes across sessions. The
system prompt includes notes from previous sessions. When the user
tells you something worth keeping — preferences, project conventions,
names, recurring context — call the `remember` tool with a short
declarative fact. Use bash, read_file, write_file, edit_file, and find
for real work — prefer edit_file over write_file for changes to existing
files (much more efficient and produces a diff for review).
"""

# Free-form metadata: parsed verbatim, exposed to plugins as
# `FactoryContext.metadata` (and `args.manifest.metadata` in
# `Tools.init()`). The runtime never interprets the keys — use this
# slot for ownership tags, ACP-client annotations, lifecycle
# markers, anything your tooling cares about.
[agent.metadata]
team = "platform-eng"
release_channel = "stable"
owners = ["mikayla"]

[providers]
notes = { path = "../notes-provider" }

[harness]
provider = "anthropic"
model = "claude-sonnet-4-5"
maxTokens = 4096
maxTurnRequests = 16
stream = true

[session]
layers = ["compacting", "notes", "in-memory"]

[tools]
bash = "builtin"
read_file = "builtin"
write_file = "builtin"
edit_file = "builtin"
find = "builtin"
web_search = "anthropic"
# `remember` doesn't need to be listed here — the `notes` session contributes it
# and owns the implementation. The runtime registers it on the agent's
# tool table automatically. Granting capabilities for it still works
# below.

[capabilities]
bash = { subprocess = "*", paths = ["./"] }
read_file = { paths = ["./"] }
write_file = { paths = ["./"] }
edit_file = { paths = ["./"] }
find = { paths = ["./"] }
remember = "*"   # the session writes to its own configured file
web_search = { allowed_domains = ["docs.anthropic.com", "github.com"] }
