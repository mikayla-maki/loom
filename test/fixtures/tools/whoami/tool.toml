[tool]
name = "greet"
description = "Build a greeting using the user's name (read from the agent's secret store)."

[tool.schema]
type = "object"
required = ["greeting"]
properties.greeting.type = "string"
properties.greeting.description = "The greeting verb (e.g. 'hello', 'hi')."

[tool.invocation]
command = "sample-greet"

[tool.secrets]
required = ["sample_user_name"]

[tool.capabilities]
filesystem = []
network = []
secrets = ["sample_user_name"]
