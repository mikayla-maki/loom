[agent]
name = "sample-agent"
description = "An end-to-end Loom demo agent."
system_prompt = "./identity.md"

[harness]
provider = "test"
# Configured in tests; CLI runs with an empty script (one greeting + stop).

[session]
provider = "file"
path = "./session.jsonl"

[capabilities]
# Per-tool ceiling, opaque shape — each tool's caps must fit its entry.
read_file = { paths = ["./"] }
write_file = { paths = ["./"] }
find = { paths = ["./"] }

[tools]
# Default builtin set, configured for the project root.
read_file = { paths = ["./"] }
write_file = { paths = ["./"] }
find = { paths = ["./"] }
echo = {}
