[agent]
name = "sample-agent"
description = "An end-to-end Loom demo agent."
system_prompt = "./identity.md"
secrets = ["sample_user_name"]

[harness]
provider = "test"

[session]
provider = "file"
path = "./session.jsonl"

[tools]
read_file  = "builtin"
write_file = "builtin"
find       = "builtin"

[capabilities]
read_file  = { paths = ["./"] }
write_file = { paths = ["./"] }
find       = { paths = ["./"] }
